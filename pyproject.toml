[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "collatz-bench"
version = "0.1.0"
description = "Collatz em Python puro vs. biblioteca nativa em C (ctypes)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
collatz-bench = "collatz_bench.cli:main"

[tool.setuptools]
packages = ["collatz_bench"]

[tool.setuptools.package-data]
collatz_bench = ["_native/*"]
